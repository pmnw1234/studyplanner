{% extends 'base.html' %}

{% block title %}Delete Certification | SkillSwap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-6 md:py-10">
    
    <div class="rounded-2xl overflow-hidden text-center" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
        
        <div class="p-6 md:p-8">
            <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style="background-color: #EF444420;">
                <i class="bi bi-exclamation-triangle text-3xl" style="color: #EF4444;"></i>
            </div>
            
            <h2 class="text-xl font-bold mb-2" style="color: var(--text-primary);">Delete Certification</h2>
            <p class="text-sm mb-4" style="color: var(--text-secondary);">
                Are you sure you want to delete <strong class="font-semibold" style="color: var(--text-primary);">"{{ certification.title }}"</strong>?
            </p>
            <p class="text-xs opacity-60 mb-6">This action cannot be undone.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="flex gap-3 justify-center">
                    <a href="{% url 'profile' %}" class="btn btn-ghost px-6 rounded-full">
                        Cancel
                    </a>
                    <button type="submit" class="btn px-6 rounded-full border-none text-white shadow-md" style="background-color: #EF4444;">
                        <i class="bi bi-trash me-1"></i> Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
