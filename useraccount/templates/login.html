<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }
        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }
        button {
            width: 95%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
        a {
            text-decoration: none;
            color: green;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 10px;
        }
        .errorlist {
            color: red;
            list-style: none;
            padding: 0;
            font-size: 12px;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}
        
        <!-- Changed from 'username' to 'email' to match the form -->
        <input type="text" name="email" placeholder="Email or Username" required>
        <input type="password" name="password" placeholder="Password" required>
        
        <!-- Display form errors -->
        {% if form.errors %}
            <div class="error">
                {% for field in form %}
                    {% for error in field.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                {% endfor %}
                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}
        
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? 
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>

</body>
</html>
