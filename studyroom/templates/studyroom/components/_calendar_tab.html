<!-- studyplanner/studyroom/templates/studyroom/components/_calendar_tab.html -->

<div class="rounded-xl shadow-lg p-6" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
        <h2 class="text-xl font-bold flex items-center gap-2" style="color: var(--text-primary);">
            <i class="bi bi-calendar-event" style="color: var(--accent-primary);"></i>
            Study Sessions Calendar
        </h2>
        <button class="btn gap-2" style="background-color: var(--accent-primary); color: white; border: none;" 
                onclick="document.getElementById('schedule-call-modal').showModal()">
            <i class="bi bi-plus-circle"></i> Schedule Call
        </button>
    </div>
    
    <!-- Simple Calendar Grid -->
    <div id="simple-calendar" class="mb-4">
        <div class="flex justify-between items-center mb-4">
            <button onclick="changeMonth(-1)" class="btn btn-sm" style="background-color: var(--bg-page); color: var(--text-primary);">
                <i class="bi bi-chevron-left"></i>
            </button>
            <h3 id="calendar-month-year" class="text-lg font-semibold" style="color: var(--text-primary);"></h3>
            <button onclick="changeMonth(1)" class="btn btn-sm" style="background-color: var(--bg-page); color: var(--text-primary);">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
        
        <!-- Day Headers -->
        <div class="grid grid-cols-7 gap-1 mb-1">
            <div class="text-center font-semibold p-2 text-sm" style="color: var(--text-secondary);">Sun</div>
            <div class="text-center font-semibold p-2 text-sm" style="color: var(--text-secondary);">Mon</div>
            <div class="text-center font-semibold p-2 text-sm" style="color: var(--text-secondary);">Tue</div>
            <div class="text-center font-semibold p-2 text-sm" style="color: var(--text-secondary);">Wed</div>
            <div class="text-center font-semibold p-2 text-sm" style="color: var(--text-secondary);">Thu</div>
            <div class="text-center font-semibold p-2 text-sm" style="color: var(--text-secondary);">Fri</div>
            <div class="text-center font-semibold p-2 text-sm" style="color: var(--text-secondary);">Sat</div>
        </div>
        
        <!-- Calendar Grid -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-1">
            <!-- Dynamically generated -->
        </div>
    </div>
    
    <!-- Upcoming Calls Widget -->
    <div class="mt-6 pt-4 border-t" style="border-color: var(--border-color);">
        <h3 class="font-semibold mb-3 flex items-center gap-2" style="color: var(--text-primary);">
            <i class="bi bi-clock-history" style="color: var(--accent-secondary);"></i>
            Upcoming Calls
        </h3>
        <div id="upcoming-calls-list" class="space-y-2">
            <div class="text-center py-3" style="color: var(--text-secondary);">
                <span class="loading loading-spinner loading-sm"></span> Loading...
            </div>
        </div>
    </div>
</div>

<script>
// Global variables
let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();
let callsData = [];

// Load calendar data
function loadCalendarData() {
    const roomId = {{ room.id }};
    const startDate = new Date(currentYear, currentMonth, 1);
    const endDate = new Date(currentYear, currentMonth + 1, 0);
    
    const startStr = startDate.toISOString().split('T')[0];
    const endStr = endDate.toISOString().split('T')[0];
    
    // ✅ FIXED: Changed /studyroom/ to /library/
    fetch(`/library/room/${roomId}/calendar-data/?start=${startStr}&end=${endStr}`)
        .then(response => response.json())
        .then(data => {
            callsData = data;
            renderCalendar();
        })
        .catch(error => {
            console.error('Error loading calendar data:', error);
            callsData = [];
            renderCalendar();
        });
}

// Render calendar
function renderCalendar() {
    const grid = document.getElementById('calendar-grid');
    const monthYear = document.getElementById('calendar-month-year');
    
    if (!grid) return;
    
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                        'July', 'August', 'September', 'October', 'November', 'December'];
    monthYear.textContent = `${monthNames[currentMonth]} ${currentYear}`;
    
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const today = new Date();
    
    let html = '';
    
    // Empty cells for days before the 1st
    for (let i = 0; i < firstDay; i++) {
        html += '<div class="p-2 min-h-[80px]" style="background-color: var(--bg-page);"></div>';
    }
    
    // Days of the month
    for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(currentYear, currentMonth, day);
        const dateStr = dateObj.toISOString().split('T')[0];
        const isToday = dateObj.toDateString() === today.toDateString();
        
        // Check if there are calls on this day
        const dayCalls = callsData.filter(call => {
            const callDate = new Date(call.start).toISOString().split('T')[0];
            return callDate === dateStr;
        });
        
        const hasCall = dayCalls.length > 0;
        const isOngoing = dayCalls.some(call => call.extendedProps?.is_ongoing);
        
        html += `
            <div class="p-2 min-h-[80px] cursor-pointer hover:shadow-lg transition rounded-lg" 
                 style="background-color: ${isToday ? 'var(--accent-primary)' : 'var(--bg-page)'}; 
                        color: ${isToday ? 'white' : 'var(--text-primary)'}; 
                        border: 1px solid ${hasCall ? (isOngoing ? '#10B981' : 'var(--accent-primary)') : 'var(--border-color)'};"
                 onclick="showDayCalls('${dateStr}')">
                <div class="font-semibold text-sm">${day}</div>
                ${hasCall ? `
                    <div class="mt-1">
                        <div class="text-xs truncate" style="color: ${isToday ? 'white' : 'var(--accent-primary)'};">
                            <i class="bi bi-camera-video"></i> ${dayCalls[0].title}
                        </div>
                        ${dayCalls.length > 1 ? `<div class="text-xs mt-0.5" style="color: ${isToday ? 'rgba(255,255,255,0.7)' : 'var(--text-secondary)'};">+${dayCalls.length - 1} more</div>` : ''}
                        ${isOngoing ? `<div class="text-xs mt-0.5" style="color: #10B981;"><i class="bi bi-circle-fill"></i> Live</div>` : ''}
                    </div>
                ` : ''}
            </div>
        `;
    }
    
    grid.innerHTML = html;
}

// Change month
function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
    } else if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
    }
    loadCalendarData();
}

// Show calls for a specific day
function showDayCalls(dateStr) {
    const dayCalls = callsData.filter(call => {
        const callDate = new Date(call.start).toISOString().split('T')[0];
        return callDate === dateStr;
    });
    
    if (dayCalls.length === 0) {
        alert('No calls scheduled for this day.');
        return;
    }
    
    let message = '📅 Calls for ' + new Date(dateStr).toLocaleDateString() + ':\n\n';
    dayCalls.forEach((call, index) => {
        const start = new Date(call.start).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const end = new Date(call.end).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const isOngoing = call.extendedProps?.is_ongoing || false;
        message += `${index + 1}. ${call.title}\n   ${start} - ${end}\n   Host: ${call.extendedProps?.created_by || 'Unknown'}`;
        if (isOngoing) {
            message += '   🔴 LIVE NOW!\n';
        }
        message += '\n';
    });
    message += 'Click "Join" on the call in the Upcoming Calls section to join.';
    alert(message);
}

// Load upcoming calls
function loadUpcomingCalls() {
    const roomId = {{ room.id }};
    const container = document.getElementById('upcoming-calls-list');
    
    if (!container) return;
    
    // ✅ FIXED: Changed /studyroom/ to /library/
    fetch('/library/room/' + roomId + '/upcoming-calls/')
        .then(response => response.json())
        .then(data => {
            if (data.upcoming_calls && data.upcoming_calls.length > 0) {
                let html = '';
                data.upcoming_calls.forEach(function(call) {
                    const startTime = new Date(call.start_time);
                    const formattedTime = startTime.toLocaleString('en-US', { 
                        month: 'short', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    const isOngoing = call.is_ongoing || false;
                    const btnColor = isOngoing ? '#10B981' : 'var(--accent-primary)';
                    
                    // ✅ FIXED: Changed /studyroom/call/ to /library/call/join/
                    const joinUrl = '/library/call/join/' + call.jitsi_room_id + '/';
                    
                    html += `
                        <div class="flex items-center justify-between p-3 rounded-lg" 
                             style="background-color: var(--bg-page); border: 1px solid ${isOngoing ? '#10B981' : 'var(--border-color)'};">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center" 
                                     style="background-color: ${btnColor};">
                                    <i class="bi bi-camera-video text-white"></i>
                                </div>
                                <div>
                                    <p class="font-medium" style="color: var(--text-primary);">${call.title}</p>
                                    <p class="text-xs" style="color: var(--text-secondary);">
                                        <i class="bi bi-clock"></i> ${formattedTime}
                                        <span class="mx-1">•</span>
                                        <i class="bi bi-person"></i> ${call.created_by}
                                        ${isOngoing ? '<span class="ml-2 text-xs" style="color: #10B981;"><i class="bi bi-circle-fill"></i> Live</span>' : ''}
                                    </p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <a href="${joinUrl}" 
                                   class="btn btn-sm gap-1" 
                                   style="background-color: ${btnColor}; color: white; border: none;">
                                    <i class="bi bi-camera-video"></i> ${isOngoing ? 'Join Now' : 'Join'}
                                </a>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `
                    <div class="text-center py-6" style="color: var(--text-secondary);">
                        <i class="bi bi-calendar-x text-3xl block mb-2"></i>
                        <p>No upcoming calls scheduled</p>
                        <button class="btn btn-sm mt-2" 
                                style="background-color: var(--accent-primary); color: white; border: none;"
                                onclick="document.getElementById('schedule-call-modal').showModal()">
                            Schedule one now
                        </button>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('Error loading upcoming calls:', error);
            container.innerHTML = `
                <div class="text-center py-3" style="color: var(--text-secondary);">
                    <i class="bi bi-exclamation-triangle"></i> Error loading calls
                </div>
            `;
        });
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    loadCalendarData();
    loadUpcomingCalls();
    
    // Auto-refresh upcoming calls every 30 seconds
    setInterval(loadUpcomingCalls, 30000);
});

// Re-render calendar when tab becomes visible
const calendarTab = document.getElementById('calendar-tab');
if (calendarTab) {
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (calendarTab.style.display !== 'none' && calendarTab.style.display !== '') {
                renderCalendar();
            }
        });
    });
    observer.observe(calendarTab, { attributes: true, attributeFilter: ['style'] });
}
</script>
