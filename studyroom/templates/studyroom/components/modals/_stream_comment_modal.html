<dialog id="comment-modal-{{ work.id }}" class="modal">
    <div class="modal-box rounded-xl" style="background-color: var(--bg-card);">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
                <i class="bi bi-x-lg"></i>
            </button>
        </form>
        <h3 class="font-bold text-lg mb-4 flex items-center gap-2" style="color: var(--text-primary);">
            <i class="bi bi-chat-text" style="color: var(--accent-primary);"></i>
            Post Stream Update: {{ work.title }}
        </h3>
        <form method="POST" action="{% url 'add_stream_comment' work.id %}">
            {% csrf_token %}
            <div class="form-control mb-4">
                <label class="label" style="color: var(--text-primary);">Your update</label>
                <textarea name="comment_text" class="textarea textarea-bordered w-full" rows="4" 
                          placeholder="Share your progress, ask for feedback, or post an update..."
                          required style="background-color: var(--bg-page); border-color: var(--border-color); color: var(--text-primary);"></textarea>
            </div>
            <div class="modal-action">
                <button type="submit" class="btn gap-2" style="background-color: var(--accent-primary); color: white; border: none;">
                    <i class="bi bi-send"></i> Post to Stream
                </button>
            </div>
        </form>
    </div>
</dialog>
