{% extends 'base.html' %}
{% load static %}

{% block title %}Messages - SkillSwap{% endblock %}

{% block extra_css %}
<style>
    .view-profile-btn {
        display: none !important;
    }
    
    /* Messages Container */
    .messages-container {
        display: flex;
        flex-direction: row;
        height: calc(100vh - 60px);
        background-color: var(--bg-page, #f9fafb);
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    
    /* Sidebar - Conversations List */
    .conversations-sidebar {
        width: 380px;
        background-color: var(--bg-card, #ffffff);
        border-right: 1px solid var(--border-color, #e5e7eb);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
    }
    
    /* Header Section */
    .conversations-header {
        padding: 20px;
        border-bottom: 1px solid var(--border-color, #e5e7eb);
        background-color: var(--bg-card, #ffffff);
    }
    
    .conversations-header h2 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 16px 0;
        color: var(--text-primary, #111827);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .conversations-header h2 i {
        color: var(--accent-primary, #8b6914);
        font-size: 22px;
    }
    
    /* Filter Buttons */
    .filter-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
    }
    
    .filter-btn {
        flex: 1;
        padding: 8px 12px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: var(--bg-page, #f9fafb);
        color: var(--text-secondary, #6b7280);
        border: 1px solid var(--border-color, #e5e7eb);
    }
    
    .filter-btn.active {
        background: linear-gradient(135deg, var(--accent-primary, #8b6914), var(--accent-ocean, #0f766e));
        color: white;
        border-color: transparent;
    }
    
    .filter-btn i {
        margin-right: 6px;
        font-size: 12px;
    }
    
    /* Search Box */
    .search-box {
        position: relative;
    }
    
    .search-box i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary, #6b7280);
        font-size: 14px;
    }
    
    .search-box input {
        width: 100%;
        padding: 10px 12px 10px 38px;
        border: 1px solid var(--border-color, #e5e7eb);
        border-radius: 30px;
        background-color: var(--bg-page, #f9fafb);
        color: var(--text-primary, #111827);
        font-size: 14px;
        outline: none;
        transition: all 0.2s ease;
    }
    
    .search-box input:focus {
        border-color: var(--accent-primary, #8b6914);
        box-shadow: 0 0 0 3px rgba(139, 105, 20, 0.1);
    }
    
    .search-box input::placeholder {
        color: var(--text-secondary, #6b7280);
        font-size: 13px;
    }
    
    /* Conversations List */
    .conversations-list {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
    }
    
    /* Conversation Item */
    .conversation-item {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-color, #e5e7eb);
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: var(--bg-card, #ffffff);
    }
    
    .conversation-item:hover {
        background-color: var(--bg-hover, #f3f4f6);
    }
    
    .conversation-item.active {
        background: linear-gradient(135deg, rgba(139, 105, 20, 0.05), rgba(15, 118, 110, 0.05));
        border-left: 3px solid var(--accent-primary, #8b6914);
    }
    
    .conversation-link {
        text-decoration: none;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        cursor: pointer;
    }
    
    /* Avatar */
    .conversation-avatar {
        flex-shrink: 0;
    }
    
    .avatar-img {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: cover;
    }
    
    .avatar-placeholder {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-primary, #8b6914), var(--accent-ocean, #0f766e));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 20px;
    }
    
    /* Conversation Info */
    .conversation-info {
        flex: 1;
        min-width: 0;
    }
    
    .conversation-name-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        gap: 10px;
    }
    
    .conversation-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary, #111827);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    
    .conversation-name.unread {
        font-weight: 800;
        color: var(--accent-primary, #8b6914);
    }
    
    .conversation-time {
        font-size: 11px;
        color: var(--text-secondary, #6b7280);
        white-space: nowrap;
        flex-shrink: 0;
    }
    
    .conversation-preview {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    
    .preview-icon {
        font-size: 12px;
        color: var(--text-secondary, #6b7280);
        opacity: 0.5;
    }
    
    .preview-text {
        font-size: 13px;
        color: var(--text-secondary, #6b7280);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
    }
    
    .preview-text.unread {
        font-weight: 600;
        color: var(--text-primary, #111827);
    }
    
    .unread-badge {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #000;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 30px;
        font-size: 10px;
        display: inline-block;
        min-width: 22px;
        text-align: center;
        margin-left: 8px;
    }
    
    /* Right Panel - Chat Area */
    .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-page, #f9fafb);
        overflow: hidden;
    }
    
    .no-chat-selected {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        padding: 40px;
    }
    
    .no-chat-selected i {
        font-size: 64px;
        color: var(--accent-primary, #8b6914);
        opacity: 0.3;
        margin-bottom: 20px;
    }
    
    .no-chat-selected h3 {
        font-size: 20px;
        color: var(--text-primary, #111827);
        margin-bottom: 10px;
    }
    
    .no-chat-selected p {
        color: var(--text-secondary, #6b7280);
        font-size: 14px;
    }
    
    /* Loading State */
    .loading-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
    }
    
    .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-color, #e5e7eb);
        border-top-color: var(--accent-primary, #8b6914);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-bottom: 16px;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    /* Empty States */
    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
    }
    
    .empty-state i {
        font-size: 48px;
        color: var(--accent-primary, #8b6914);
        opacity: 0.3;
        margin-bottom: 16px;
    }
    
    .empty-state h5 {
        font-size: 16px;
        color: var(--text-primary, #111827);
        margin-bottom: 8px;
    }
    
    .empty-state p {
        font-size: 13px;
        color: var(--text-secondary, #6b7280);
        margin-bottom: 20px;
    }
    
    .btn-primary-custom {
        background: linear-gradient(135deg, var(--accent-primary, #8b6914), var(--accent-ocean, #0f766e));
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .btn-primary-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(139, 105, 20, 0.3);
        color: white;
    }
    
    /* Scrollbar Styling */
    .conversations-list::-webkit-scrollbar {
        width: 4px;
    }
    
    .conversations-list::-webkit-scrollbar-track {
        background: var(--bg-page, #f9fafb);
    }
    
    .conversations-list::-webkit-scrollbar-thumb {
        background: var(--border-color, #e5e7eb);
        border-radius: 4px;
    }
    
    .conversations-list::-webkit-scrollbar-thumb:hover {
        background: var(--accent-primary, #8b6914);
    }
    
    /* Animations */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateX(-10px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    
    .conversation-item {
        animation: fadeIn 0.2s ease forwards;
    }
    
    /* ==================== */
    /* RESPONSIVE DESIGN */
    /* ==================== */
    
    /* Tablet View */
    @media (max-width: 1024px) and (min-width: 769px) {
        .conversations-sidebar {
            width: 320px;
        }
        
        .conversation-item {
            padding: 14px 16px;
        }
        
        .avatar-img,
        .avatar-placeholder {
            width: 48px;
            height: 48px;
            font-size: 18px;
        }
        
        .conversation-name {
            font-size: 14px;
        }
        
        .preview-text {
            font-size: 12px;
        }
    }
    
    /* Mobile View - Stack Layout */
    @media (max-width: 768px) {
        .messages-container {
            flex-direction: column;
            height: calc(100vh - 56px);
        }
        
        .conversations-sidebar {
            width: 100%;
            height: 100%;
            border-right: none;
            border-bottom: 1px solid var(--border-color, #e5e7eb);
        }
        
        .chat-area {
            height: 100%;
        }
        
        .messages-container.conversation-open .conversations-sidebar {
            display: none;
        }
        
        .messages-container.conversation-open .chat-area {
            display: flex;
        }
        
        .conversations-header {
            padding: 16px;
        }
        
        .conversations-header h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }
        
        .conversation-item {
            padding: 14px 16px;
        }
        
        .avatar-img,
        .avatar-placeholder {
            width: 48px;
            height: 48px;
            font-size: 18px;
        }
        
        .conversation-name {
            font-size: 14px;
        }
        
        .preview-text {
            font-size: 12px;
        }
        
        .filter-btn {
            padding: 8px 12px;
            font-size: 12px;
        }
        
        .search-box input {
            font-size: 13px;
            padding: 9px 12px 9px 38px;
        }
    }
    
    /* Small Mobile View */
    @media (max-width: 480px) {
        .conversations-header {
            padding: 12px;
        }
        
        .filter-buttons {
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .filter-btn {
            padding: 6px 10px;
            font-size: 11px;
        }
        
        .conversation-item {
            padding: 12px;
        }
        
        .avatar-img,
        .avatar-placeholder {
            width: 44px;
            height: 44px;
            font-size: 16px;
        }
        
        .conversation-name {
            font-size: 13px;
        }
        
        .preview-text {
            font-size: 11px;
        }
        
        .conversation-time {
            font-size: 9px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="messages-container" id="messagesContainer">
    <!-- Left Sidebar - Conversations List -->
    <div class="conversations-sidebar" id="conversationsSidebar">
        <div class="conversations-header">
            <h2>
                <i class="bi bi-chat-dots-fill"></i>
                Messages
            </h2>
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    <i class="bi bi-inbox"></i> All
                </button>
                <button class="filter-btn" data-filter="unread">
                    <i class="bi bi-envelope-exclamation"></i> Unread
                </button>
            </div>
            
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="text" id="searchInput" placeholder="Search conversations...">
            </div>
        </div>
        
        <div class="conversations-list" id="conversationsList">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading conversations...</p>
            </div>
        </div>
    </div>
    
    <!-- Right Panel - Chat Area (Placeholder) -->
    <div class="chat-area" id="chatArea">
        <div class="no-chat-selected">
            <i class="bi bi-chat-square-heart"></i>
            <h3>Your Messages</h3>
            <p>Select a conversation to start messaging</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let allConversations = [];
    let currentFilter = 'all';
    let currentSearchTerm = '';

    async function loadConversations() {
        const container = document.getElementById('conversationsList');
        
        try {
            const response = await fetch('/messages/conversations/');
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data && data.conversations && data.conversations.length > 0) {
                allConversations = data.conversations;
                applyFilterAndDisplay();
            } else {
                showEmptyState();
            }
            
        } catch (error) {
            console.error('Error loading conversations:', error);
            showError();
        }
    }
    
    function applyFilterAndDisplay() {
        let filtered = [...allConversations];
        
        // Apply unread filter
        if (currentFilter === 'unread') {
            filtered = filtered.filter(conv => conv.unread_count > 0);
        }
        
        // Apply search filter
        if (currentSearchTerm) {
            filtered = filtered.filter(conv => {
                const userName = conv.first_name ? `${conv.first_name} ${conv.last_name}` : conv.username;
                return userName.toLowerCase().includes(currentSearchTerm);
            });
        }
        
        if (filtered.length === 0) {
            if (currentFilter === 'unread' && allConversations.length > 0) {
                showNoUnreadState();
            } else if (currentSearchTerm) {
                showNoResultsState();
            } else {
                showEmptyState();
            }
        } else {
            displayConversations(filtered);
        }
    }
    
    function displayConversations(conversations) {
        const container = document.getElementById('conversationsList');
        
        let html = '';
        
        conversations.forEach(conv => {
            const userName = conv.first_name ? `${conv.first_name} ${conv.last_name}` : conv.username;
            const userInitial = (conv.first_name ? conv.first_name[0] : conv.username[0]).toUpperCase();
            const hasProfilePic = conv.profile_picture && conv.profile_picture !== '';
            const lastMessage = conv.last_message || 'No messages yet';
            const lastMessageTime = conv.last_message_time || '';
            const unreadCount = conv.unread_count || 0;
            const isUnread = unreadCount > 0;
            
            // Truncate message
            const truncatedMessage = lastMessage.length > 50 ? lastMessage.substring(0, 47) + '...' : lastMessage;
            
            html += `
                <div class="conversation-item" data-user-id="${conv.user_id}" data-username="${escapeHtml(userName)}" onclick="openConversation(${conv.user_id}, '${escapeHtml(userName)}')">
                    <div class="conversation-link">
                        <div class="conversation-avatar">
                            ${hasProfilePic ? 
                                `<img src="${escapeHtml(conv.profile_picture)}" class="avatar-img" alt="${escapeHtml(userName)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` +
                                `<div class="avatar-placeholder" style="display: none;">${escapeHtml(userInitial)}</div>` :
                                `<div class="avatar-placeholder">${escapeHtml(userInitial)}</div>`
                            }
                        </div>
                        <div class="conversation-info">
                            <div class="conversation-name-row">
                                <div class="conversation-name ${isUnread ? 'unread' : ''}">
                                    ${escapeHtml(userName)}
                                    ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
                                </div>
                                ${lastMessageTime ? `<div class="conversation-time">${escapeHtml(lastMessageTime)}</div>` : ''}
                            </div>
                            <div class="conversation-preview">
                                <i class="bi bi-chat-dots preview-icon"></i>
                                <div class="preview-text ${isUnread ? 'unread' : ''}">
                                    ${escapeHtml(truncatedMessage)}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }
    
    function openConversation(userId, userName) {
        // On mobile, store that we're opening a conversation
        if (window.innerWidth <= 768) {
            const container = document.getElementById('messagesContainer');
            container.classList.add('conversation-open');
            
            // Store the conversation state
            sessionStorage.setItem('conversationOpen', 'true');
            sessionStorage.setItem('currentConversationId', userId);
        }
        
        // Store selected user in localStorage
        localStorage.setItem('selectedConversation', userId);
        localStorage.setItem('selectedUserName', userName);
        
        // Redirect to the chat page using the correct URL pattern
        window.location.href = `/messages/chat/${userId}/`;
    }
    
    function showEmptyState() {
        const container = document.getElementById('conversationsList');
        container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-chat-square-heart"></i>
                <h5>No messages yet</h5>
                <p>Start a conversation with your connections</p>
                <a href="/dashboard/" class="btn-primary-custom">
                    <i class="bi bi-people"></i> Find Connections
                </a>
            </div>
        `;
    }
    
    function showNoUnreadState() {
        const container = document.getElementById('conversationsList');
        container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-envelope-check"></i>
                <h5>All caught up! 🎉</h5>
                <p>You have no unread messages</p>
            </div>
        `;
    }
    
    function showNoResultsState() {
        const container = document.getElementById('conversationsList');
        container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-search"></i>
                <h5>No conversations found</h5>
                <p>Try a different name</p>
            </div>
        `;
    }
    
    function showError() {
        const container = document.getElementById('conversationsList');
        container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-wifi-off"></i>
                <h5>Connection error</h5>
                <p>Please check your internet connection</p>
                <button onclick="location.reload()" class="btn-primary-custom">
                    <i class="bi bi-arrow-repeat"></i> Try Again
                </button>
            </div>
        `;
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Debounced search handler
    let searchTimeout;
    function handleSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentSearchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            applyFilterAndDisplay();
        }, 300);
    }
    
    function setFilter(filter) {
        currentFilter = filter;
        
        // Update active button UI
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.getAttribute('data-filter') === filter) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        applyFilterAndDisplay();
    }
    
    // Check for selected conversation on load
    function checkSelectedConversation() {
        const selectedId = localStorage.getItem('selectedConversation');
        if (selectedId) {
            const selectedItem = document.querySelector(`.conversation-item[data-user-id="${selectedId}"]`);
            if (selectedItem) {
                selectedItem.classList.add('active');
            }
        }
        
        // Check if we're on mobile and coming back from a conversation
        if (window.innerWidth <= 768) {
            const wasOpen = sessionStorage.getItem('conversationOpen');
            if (wasOpen === 'true') {
                const container = document.getElementById('messagesContainer');
                container.classList.add('conversation-open');
                sessionStorage.removeItem('conversationOpen');
            }
        }
    }
    
    // Reset mobile view when page loads fresh
    function resetMobileView() {
        if (window.innerWidth <= 768) {
            const container = document.getElementById('messagesContainer');
            // Only hide sidebar if we're not coming back from a conversation
            if (!sessionStorage.getItem('conversationOpen')) {
                container.classList.remove('conversation-open');
            }
        }
    }
    
    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
        resetMobileView();
        loadConversations();
        
        // Search input
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', handleSearch);
        }
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setFilter(btn.getAttribute('data-filter'));
            });
        });
        
        // Check for selected conversation after loading
        setTimeout(checkSelectedConversation, 500);
    });
</script>
{% endblock %}
