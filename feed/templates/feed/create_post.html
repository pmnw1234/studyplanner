<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f6f8; /* clean white/soft gray */
    }

    .container {
        width: 500px;
        margin: 50px auto;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        border: 1px solid #eee;
    }

    .card h2 {
        margin-bottom: 20px;
        color: #c49a2a; /* gold accent */
    }

    input, textarea, select {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: white;
        color: #333;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: #c49a2a;
    }

    /* MAIN POST BUTTON */
    button {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #8b6914, #c49a2a);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        opacity: 0.9;
    }

    /* TYPE BUTTONS */
    .type-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 15px;
    }

    .type-buttons button {
        background: linear-gradient(135deg, #8b6914, #c49a2a);
    }

    .type-buttons button:hover {
        opacity: 0.9;
    }

    .back {
        display: block;
        margin-top: 15px;
        text-align: center;
        text-decoration: none;
        color: #c49a2a; /* gold link */
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>Create a Post</h2>

        <form method="POST" onsubmit="return validateForm()">
            {% csrf_token %}

            <!-- Title -->
            {{ form.title.label_tag }}
            {{ form.title }}

            <!-- Description -->
            {{ form.description.label_tag }}
            {{ form.description }}

            <!-- TYPE BUTTONS -->
            <div class="type-buttons">

                <button type="button" onclick="setType('study')">
                     find study partner?
                </button>

                <button type="button" onclick="setType('skill')">
                     Skill Swap?
                </button>

            </div>

            <!-- hidden field -->
            <input type="hidden" name="post_type" id="post_type">

            <!-- POST BUTTON -->
            <button type="submit">
                Post
            </button>

        </form>

        <a href="{% url 'feed' %}" class="back">← Back to Feed</a>

    </div>
</div>

<script>
function setType(type) {
    document.getElementById('post_type').value = type;

    // show selected (for testing)
    alert("Selected: " + type);
}

function validateForm() {
    const type = document.getElementById('post_type').value;

    if (!type) {
        alert("Please select Study Partner or Skill Swap");
        return false;
    }

    return true;
}
</script>

</body>
</html>
